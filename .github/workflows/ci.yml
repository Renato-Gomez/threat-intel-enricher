name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Replicando el stage 'formatting'[cite: 4]
  formatting:
    name: Code Formatting & Linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit yapf isort
    - name: Run pre-commit hooks
      run: pre-commit run --all-files --show-diff-on-failure
        # Fail the pipeline if formatting checks fail[cite: 4]

  # Job 2: Replicando el stage 'test'[cite: 4]
  test:
    name: Unit Testing (Python 3.11)
    needs: formatting # Solo corre si el formato es correcto, replicando stages[cite: 4]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Micromamba
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-file: environment.yml
        environment-name: threat-intel-enricher
        cache-environment: true   # Replicando la lógica de cache del PIP_CACHE_DIR[cite: 4]

    - name: Run Tests with Pytest
      shell: bash -l {0}
      run: |
        pytest tests/ -v
